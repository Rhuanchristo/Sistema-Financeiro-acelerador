<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Financeiro & Patrimônio</title>
  <style>
    :root { --bg:#f6f7f9; --card:#fff; --ink:#1d2330; --muted:#6b7280; --line:#e5e7eb; --accent:#1f4e79; --danger:#b42318; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--ink); }
    header { background:var(--accent); color:#fff; padding:14px 24px; display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
    header h1 { font-size:18px; margin:0; font-weight:600; }
    main { padding:24px; max-width:1200px; margin:0 auto; }
    section.card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:20px; margin-bottom:20px; }
    h2 { font-size:16px; margin:0 0 14px; }
    h3 { font-size:14px; margin:18px 0 10px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
    table { width:100%; border-collapse:collapse; font-size:14px; }
    th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); white-space:nowrap; }
    th { color:var(--muted); font-weight:600; font-size:12px; }
    td.num, th.num { text-align:right; font-variant-numeric: tabular-nums; }
    tr.total td { font-weight:700; border-top:2px solid var(--ink); }
    .row { display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; margin-bottom:12px; }
    label { display:flex; flex-direction:column; font-size:12px; color:var(--muted); gap:4px; }
    input, select { padding:8px 10px; border:1px solid #cfd4dc; border-radius:6px; font-size:14px; min-width:120px; }
    input.num { text-align:right; width:110px; min-width:0; }
    button { padding:8px 14px; border:0; border-radius:6px; background:var(--accent); color:#fff; font-size:14px; cursor:pointer; }
    button.ghost { background:transparent; color:var(--accent); border:1px solid var(--accent); }
    button.danger { background:var(--danger); }
    button.light { background:#fff; color:var(--accent); }
    .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; margin-bottom:20px; }
    .kpi { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; }
    .kpi span { display:block; font-size:12px; color:var(--muted); }
    .kpi strong { font-size:20px; }
    .muted { color:var(--muted); font-size:13px; }
    .msg { color:var(--danger); font-size:14px; margin:10px 0; }
    .center { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
    .login { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:32px; max-width:380px; text-align:center; }
    .login h1 { font-size:20px; margin:0 0 8px; }
    .scroll { overflow-x:auto; }
    .badge { font-size:11px; padding:2px 8px; border-radius:99px; background:#e8f0f8; color:var(--accent); }
    .badge.off { background:#fde8e6; color:var(--danger); }
    .corpo { display:flex; min-height: calc(100vh - 60px); }
    .sidebar { width:210px; background:#fff; border-right:1px solid var(--line); padding:16px 10px; flex-shrink:0; }
    .menu-item { display:block; width:100%; text-align:left; background:transparent; color:var(--ink); margin-bottom:4px; font-size:15px; padding:10px 12px; }
    .menu-item.ativo { background:#e8f0f8; color:var(--accent); font-weight:600; }
    .conteudo { flex:1; padding:24px; min-width:0; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>

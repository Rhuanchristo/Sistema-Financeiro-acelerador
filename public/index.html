<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#132721" />
  <meta name="color-scheme" content="light" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <title>Financeiro & Patrimônio · AP</title>
  <link rel="icon" href="./img/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Poppins:wght@400;500;600&display=swap" />
  <style>
    /* Marca AP/ARKA: verde profundo, off-white e dourado discreto (mesma do Wealth Insight Planner). */
    :root {
      --verde-profundo:#132721; --verde:#2C4A3E; --verde-claro:#8FA89B;
      --offwhite:#F5F0E8; --areia:#ECE7DE; --linha:#DDD6CA;
      --dourado:#C9A96E; --carvao:#2A2A2A; --cinza:#8A8580; --cinza-texto:#6E6A65;
      --vermelho:#B0413E; --vermelho-fundo:#F3E1DF; --verde-fundo:#E3EBE6;
      --card:#FFFFFF;
      --serif:"Cormorant Garamond", Georgia, serif;
      --sans:"Poppins", system-ui, -apple-system, "Segoe UI", sans-serif;
      --raio:10px;
      /* Nomes antigos, ainda usados por estilos inline das telas. */
      --accent:var(--verde-profundo); --danger:var(--vermelho); --line:var(--linha); --muted:var(--cinza-texto); --ink:var(--carvao);
    }
    * { box-sizing:border-box; }
    body { margin:0; font-family:var(--sans); font-size:14px; line-height:1.5; background:var(--offwhite); color:var(--carvao); -webkit-font-smoothing:antialiased; }
    ::selection { background:color-mix(in srgb, var(--dourado) 35%, transparent); color:var(--verde-profundo); }

    /* ---------- Estrutura: menu verde à esquerda, página à direita ---------- */
    .app { display:grid; grid-template-columns:248px minmax(0,1fr); min-height:100vh; }
    .sidebar { background:var(--verde-profundo); color:var(--offwhite); display:flex; flex-direction:column; padding:28px 16px 20px; position:sticky; top:0; height:100vh; overflow-y:auto; }
    .marca { display:block; padding:0 8px 28px; }
    .marca img { display:block; height:44px; width:auto; }
    .menu { display:flex; flex-direction:column; gap:2px; }
    .menu-item { display:block; width:100%; text-align:left; background:transparent; color:color-mix(in srgb, var(--offwhite) 72%, transparent); border:0; border-left:2px solid transparent; border-radius:0 var(--raio) var(--raio) 0; font:400 14px/1.4 var(--sans); padding:10px 14px; cursor:pointer; }
    .menu-item:hover { color:var(--offwhite); background:color-mix(in srgb, var(--verde) 55%, transparent); }
    .menu-item.ativo { color:var(--offwhite); background:var(--verde); border-left-color:var(--dourado); font-weight:500; }
    .menu-voltar { color:var(--dourado); }
    .menu-grupo { font-size:12px; color:var(--verde-claro); padding:18px 14px 6px; }
    .sidebar-rodape { margin-top:auto; padding:20px 8px 0; border-top:1px solid color-mix(in srgb, var(--offwhite) 14%, transparent); display:flex; flex-direction:column; gap:10px; }
    .sidebar-rodape .quem { font-size:12px; color:var(--verde-claro); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .sidebar-rodape .acoes { display:flex; gap:8px; flex-wrap:wrap; }
    .sidebar-rodape-celular { display:none; }

    .conteudo { padding:48px clamp(24px, 3.2vw, 72px) 72px; min-width:0; max-width:1800px; width:100%; margin:0 auto; }
    .pagina { display:flex; justify-content:space-between; align-items:flex-end; gap:16px; flex-wrap:wrap; margin-bottom:28px; }
    .pagina h1 { font:500 40px/1.1 var(--serif); color:var(--verde-profundo); margin:0; letter-spacing:-.005em; }
    .pagina p { margin:6px 0 0; color:var(--cinza-texto); }
    .pagina .voltar { background:transparent; border:0; color:var(--verde); padding:0; margin:0 0 10px; font-size:13px; min-height:0; }
    .pagina .voltar:hover { color:var(--verde-profundo); text-decoration:underline; background:transparent; }

    /* Conexões: um cartão por ferramenta, com o botão alinhado na base. */
    .ferramentas { display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); gap:16px; }
    .ferramenta { display:flex; flex-direction:column; justify-content:space-between; gap:20px; margin:0 !important; }
    .ferramenta h2 { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
    .ferramenta p { margin:0; }
    .ferramenta button { align-self:flex-start; }

    /* ---------- Tipografia ---------- */
    h1, h2 { font-family:var(--serif); font-weight:500; color:var(--verde-profundo); text-wrap:balance; }
    h2 { font-size:24px; line-height:1.2; margin:0 0 16px; }
    h3 { font:600 13px/1.4 var(--sans); color:var(--verde); margin:22px 0 10px; }
    p { text-wrap:pretty; }
    .muted { color:var(--cinza-texto); font-size:13px; }
    .msg { color:var(--vermelho); font-size:14px; margin:10px 0; }

    /* ---------- Superfícies ---------- */
    section.card { background:var(--card); border:1px solid var(--linha); border-radius:var(--raio); padding:24px; margin-bottom:20px; box-shadow:0 1px 2px rgba(19,39,33,.04), 0 6px 18px rgba(19,39,33,.035); }
    .scroll { overflow-x:auto; }

    /* Os valores em dinheiro são o destaque: serifa da marca com algarismos alinhados. */
    .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:14px; margin-bottom:24px; }
    /* Linhas internas desenhadas por cada indicador: uma última linha incompleta fica limpa. */
    .kpi { background:var(--card); border:1px solid var(--linha); border-radius:var(--raio); padding:16px 18px; min-width:0; aspect-ratio:1 / 1; display:flex; flex-direction:column; justify-content:space-between; box-shadow:0 1px 2px rgba(19,39,33,.04); }
    .kpi span { display:block; font-size:12px; color:var(--cinza-texto); margin-bottom:6px; }
    .kpi strong { display:block; font:500 clamp(18px, 1.6vw, 24px)/1.15 var(--serif); color:var(--verde-profundo); font-variant-numeric:lining-nums tabular-nums; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

    /* ---------- Tabelas ---------- */
    table { width:100%; border-collapse:collapse; font-size:13.5px; }
    /* Textos quebram linha para a tabela caber na tela; valores, datas e botões ficam numa linha só. */
    th, td { text-align:left; padding:10px 8px; border-bottom:1px solid var(--areia); white-space:normal; vertical-align:middle; }
    th:first-child, td:first-child { padding-left:0; }
    th:last-child, td:last-child { padding-right:0; }
    td.num, th.num, td:has(> button), td:has(> div > button), td:has(> input[type="checkbox"]) { white-space:nowrap; }
    table.matriz th, table.matriz td { white-space:nowrap; }
    td > button + button, td > div > button + button { margin-left:6px; }
    td button { padding:6px 11px; font-size:13px; }
    input[type="checkbox"], input[type="radio"] { min-width:0; width:auto; padding:0; }
    th { color:var(--cinza-texto); font-weight:500; font-size:12px; border-bottom-color:var(--linha); }
    td.num, th.num { text-align:right; font-variant-numeric:lining-nums tabular-nums; }
    tbody tr:hover td { background:color-mix(in srgb, var(--areia) 45%, transparent); }
    tr.total td { font-weight:600; color:var(--verde-profundo); border-top:1px solid var(--verde-profundo); border-bottom:0; }

    /* ---------- Formulários e botões ---------- */
    .row { display:flex; gap:12px; flex-wrap:wrap; align-items:flex-end; margin-bottom:14px; }
    label { display:flex; flex-direction:column; font-size:12px; color:var(--cinza-texto); gap:5px; }
    input, select, textarea { font:400 14px var(--sans); color:var(--carvao); padding:9px 11px; border:1px solid var(--linha); border-radius:var(--raio); background:var(--card); min-width:120px; }
    input:focus, select:focus, textarea:focus { border-color:var(--dourado); outline:none; box-shadow:0 0 0 3px color-mix(in srgb, var(--dourado) 25%, transparent); }
    input.num { text-align:right; width:110px; min-width:0; font-variant-numeric:tabular-nums; }
    button { font:500 14px var(--sans); padding:9px 16px; border:1px solid var(--verde-profundo); border-radius:var(--raio); background:var(--verde-profundo); color:var(--offwhite); cursor:pointer; }
    button:hover { background:var(--verde); border-color:var(--verde); }
    button.ghost { background:transparent; color:var(--verde-profundo); border-color:var(--linha); }
    button.ghost:hover { border-color:var(--verde-profundo); background:var(--card); }
    button.danger { background:transparent; color:var(--vermelho); border-color:color-mix(in srgb, var(--vermelho) 40%, transparent); }
    button.danger:hover { background:var(--vermelho); color:var(--offwhite); border-color:var(--vermelho); }
    button.light { background:transparent; color:var(--offwhite); border-color:color-mix(in srgb, var(--offwhite) 35%, transparent); font-size:13px; padding:7px 12px; }
    button.light:hover { border-color:var(--dourado); color:var(--dourado); background:transparent; }
    button:disabled { opacity:.55; cursor:wait; }
    :focus-visible { outline:2px solid var(--dourado); outline-offset:2px; }

    .badge { display:inline-block; font-size:11.5px; font-weight:500; padding:2px 9px; border-radius:99px; background:var(--verde-fundo); color:var(--verde); }
    .badge.off { background:var(--vermelho-fundo); color:var(--vermelho); }

    /* ---------- Entrada (login / acesso negado) ---------- */
    .entrada { min-height:100vh; display:grid; grid-template-columns:minmax(0,1.1fr) minmax(0,1fr); }
    .entrada-marca { background:var(--verde-profundo); color:var(--offwhite); padding:56px 64px; display:flex; flex-direction:column; justify-content:space-between; gap:48px; }
    .entrada-marca img { height:64px; width:auto; align-self:flex-start; }
    .entrada-marca h1 { font:400 clamp(40px, 5vw, 64px)/1.05 var(--serif); color:var(--offwhite); margin:0; max-width:12ch; }
    .entrada-marca p { color:var(--verde-claro); max-width:40ch; margin:18px 0 0; font-size:15px; }
    .entrada-marca small { color:var(--verde-claro); font-size:12px; }
    .entrada-form { display:flex; align-items:center; justify-content:center; padding:48px 24px; }
    .login { width:100%; max-width:360px; }
    .login h2 { font-size:32px; margin:0 0 8px; }
    .login p { margin:0 0 28px; color:var(--cinza-texto); }
    .login button { width:100%; padding:13px 16px; font-size:15px; }
    .center { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }

    .topo-acoes { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin:0; }

    @media (prefers-reduced-motion: no-preference) {
      .entrada-marca h1, .entrada-marca p { animation:surgir .6s ease-out both; }
      .entrada-marca p { animation-delay:.12s; }
      @keyframes surgir { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
    }

    /* ---------- Celular (abaixo de 768px): o cliente usa muito pelo telefone ---------- */
    @media (max-width: 767px) {
      .app { grid-template-columns:minmax(0,1fr); }
      .sidebar { position:sticky; top:0; z-index:10; height:auto; padding:12px 0 0; overflow:visible; }
      .marca { padding:0 16px 8px; display:flex; align-items:center; justify-content:space-between; gap:12px; }
      .marca img { height:30px; }
      .sidebar-rodape-celular { display:flex; }
      .menu { flex-direction:row; gap:4px; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; padding:0 12px; }
      .menu::-webkit-scrollbar { display:none; }
      .menu-item { width:auto; flex-shrink:0; white-space:nowrap; border-left:0; border-bottom:2px solid transparent; border-radius:0; padding:10px 12px 11px; min-height:44px; }
      .menu-item.ativo { background:transparent; border-bottom-color:var(--dourado); }
      .menu-grupo { flex-shrink:0; white-space:nowrap; padding:13px 6px 0 14px; border-left:1px solid color-mix(in srgb, var(--offwhite) 18%, transparent); }
      .sidebar-rodape { display:none; }

      .conteudo { padding:22px 16px 48px; max-width:none !important; margin:0 !important; }
      .pagina { margin-bottom:18px; }
      .pagina h1 { font-size:30px; }
      section.card { padding:16px; overflow-x:auto; }
      h2 { font-size:21px; }
      .kpis { grid-template-columns:repeat(2, minmax(0,1fr)); }
      .kpi { padding:14px 14px 12px; }
      .kpi:last-child:nth-child(odd) { grid-column:1 / -1; }
      .kpi strong { font-size:22px; }
      .conteudo [style*="grid-template-columns"] { grid-template-columns:minmax(0,1fr) !important; }

      .row { flex-direction:column; align-items:stretch; }
      .row > *, .row label, .row input, .row select, .row textarea { width:100% !important; min-width:0 !important; max-width:100%; }
      .row > button, .row > label > button { width:100%; }
      .row input[type="checkbox"], .row input[type="radio"] { width:auto !important; }
      .topo-acoes.row { flex-direction:row; align-items:center; }
      table input, table select { min-width:0 !important; }
      button, input, select, textarea { min-height:44px; }
      .sidebar button.light { min-height:36px; }
      input, select, textarea { font-size:16px; }
      input[type="checkbox"], input[type="radio"] { min-height:0; width:22px; height:22px; }

      .modal-fundo { padding:0 !important; align-items:flex-end !important; }
      .modal-card { padding:20px 16px !important; max-height:94vh !important; border-radius:14px 14px 0 0 !important; }

      .entrada { grid-template-columns:minmax(0,1fr); }
      .entrada-marca { padding:32px 22px 36px; gap:28px; }
      .entrada-marca img { height:42px; }
      .entrada-marca small { display:none; }
      .entrada-form { align-items:flex-start; padding:32px 22px; }
    }

    /* ---------- Tablet (768 a 1099px): menu mais estreito e respiro menor ---------- */
    @media (min-width: 768px) and (max-width: 1099px) {
      .app { grid-template-columns:208px minmax(0,1fr); }
      .sidebar { padding:24px 12px 18px; }
      .marca img { height:38px; }
      .conteudo { padding:32px 28px 48px; }
      .pagina h1 { font-size:34px; }
      .conteudo [style*="grid-template-columns"] { grid-template-columns:minmax(0,1fr) !important; }
      .entrada-marca { padding:44px 40px; }
    }

    /* ---------- Até 1279px: tabelas viram cartões, com quantas colunas couberem ---------- */
    @media (max-width: 1279px) {
      table.empilha, table.empilha tbody { display:block; width:100%; }
      table.empilha thead { display:none; }
      /* Cada linha vira um cartão em 2 colunas, com o rótulo em cima do valor. */
      table.empilha tr { display:grid; grid-template-columns:repeat(auto-fill, minmax(140px, 1fr)); gap:8px 16px; padding:14px 0; border-bottom:1px solid var(--areia); }
      table.empilha tbody tr:hover td { background:transparent; }
      table.empilha td { display:block; padding:0; border:0; white-space:normal; text-align:left; overflow-wrap:anywhere; min-width:0; }
      table.empilha td::before { content:attr(data-label); display:block; font-size:11.5px; color:var(--cinza-texto); margin-bottom:1px; }
      table.empilha td[data-label=""] { grid-column:1 / -1; }
      table.empilha td[data-label=""]::before { content:none; }
      table.empilha td:empty { display:none; }
      table.empilha td button { min-height:40px; }
      /* Ações, caixas de seleção e linhas de grupo ocupam a largura toda. */
      table.empilha td:has(> button), table.empilha td:has(> div > button) { grid-column:1 / -1; display:flex; justify-content:flex-end; gap:8px; }
      table.empilha td:has(> button)::before, table.empilha td:has(> div > button)::before { content:none; }
      table.empilha td > div:has(> button) { display:flex !important; flex-direction:row !important; flex-wrap:wrap; gap:8px; justify-content:flex-end; width:100% !important; }
      table.empilha td > div:has(> button) > *, table.empilha td > button { width:auto !important; margin:0 !important; }
      table.empilha td:has(> input[type="checkbox"]) { grid-column:1 / -1; }
      table.empilha td:has(> input[type="checkbox"])::before { content:none; }
      table.empilha tr:has(> td[colspan]) { display:block; padding:10px 0; }
      table.empilha tr.total { border-bottom:0; border-top:1px solid var(--verde-profundo); margin-top:4px; }
      table.empilha tr.total td { border:0; font-weight:600; }
      section.card:has(table.empilha), .scroll:has(table.empilha) { overflow-x:visible; }

      /* Grade mês a mês: continua rolando de lado, com a coluna da categoria fixa. */
      table.matriz th:first-child, table.matriz td:first-child { position:sticky; left:0; z-index:1; background:var(--card); box-shadow:1px 0 0 var(--linha); }
    }

    /* ---------- Home (página de abertura) ---------- */
    .inicio { display:flex; flex-direction:column; }
    .inicio-hero { position:relative; overflow:hidden; display:grid; grid-template-columns:minmax(0,1fr) auto; gap:24px; align-items:center; background:linear-gradient(135deg, var(--verde-profundo) 0%, var(--verde) 100%); color:var(--offwhite); border-radius:14px; padding:30px 32px; margin-bottom:20px; box-shadow:0 10px 30px rgba(19,39,33,.18); }
    .inicio-hero::after { content:""; position:absolute; right:-80px; top:-80px; width:260px; height:260px; border-radius:50%; background:radial-gradient(circle, color-mix(in srgb, var(--dourado) 35%, transparent), transparent 70%); pointer-events:none; }
    .inicio-hero > * { position:relative; z-index:1; }
    .inicio-sub { margin:0; color:var(--verde-claro); font-size:13px; }
    .inicio-rotulo { margin:14px 0 0; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--dourado); }
    .inicio-valor { margin:4px 0 6px; font:500 clamp(36px,5vw,58px)/1.05 var(--serif); font-variant-numeric:lining-nums tabular-nums; color:var(--offwhite); }
    .inicio-var { margin:0; font-size:14px; }
    .inicio-var.pos, .pos { color:#9FD3B5; }
    .inicio-var.neg, .neg { color:#F1A9A6; }
    .inicio-hero-lado { display:grid; gap:10px; min-width:200px; }
    .inicio-mini { background:color-mix(in srgb, var(--offwhite) 9%, transparent); border:1px solid color-mix(in srgb, var(--offwhite) 14%, transparent); border-radius:var(--raio); padding:12px 16px; display:flex; flex-direction:column; gap:2px; }
    .inicio-mini span { font-size:12px; color:var(--verde-claro); }
    .inicio-mini strong { font:500 19px/1.2 var(--serif); font-variant-numeric:lining-nums tabular-nums; }
    .inicio-kpis { display:grid; grid-template-columns:repeat(auto-fit, minmax(190px, 1fr)); gap:14px; margin-bottom:20px; }
    .inicio-kpi { background:var(--card); border:1px solid var(--linha); border-left:4px solid var(--cor); border-radius:var(--raio); padding:16px 18px; min-width:0; box-shadow:0 1px 2px rgba(19,39,33,.04); }
    .inicio-kpi span { display:block; font-size:12px; color:var(--cinza-texto); }
    .inicio-kpi strong { display:block; margin:6px 0 4px; font:500 clamp(18px,1.7vw,24px)/1.15 var(--serif); color:var(--verde-profundo); font-variant-numeric:lining-nums tabular-nums; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .inicio-kpi p { margin:0; font-size:12px; }
    /* Resumo da página de Lançamentos: três indicadores lado a lado (receitas, despesas e lucro líquido). */
    .lanc-resumo { display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:14px; margin-bottom:16px; }
    .lanc-resumo .inicio-kpi { min-width:0; }
    @media (max-width: 520px) {
      .lanc-resumo { gap:8px; }
      .lanc-resumo .inicio-kpi { padding:12px 12px; }
      .lanc-resumo .inicio-kpi span { font-size:11px; }
      .lanc-resumo .inicio-kpi strong { font-size:15px; }
      .lanc-resumo .inicio-kpi p { display:none; }
    }
    .inicio-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(340px, 1fr)); gap:20px; align-items:stretch; }
    .inicio-grid > section.card { margin:0; display:flex; flex-direction:column; min-width:0; }
    .inicio-grid > section.card > .inicio-canvas, .inicio-grid > section.card > .inicio-duas { margin-top:auto; }
    .inicio-grid > section.card > .inicio-lista { margin-top:0; }
    .inicio-canvas { position:relative; height:280px; }
    .inicio-duas { display:flex; flex-direction:column; gap:18px; min-width:0; }
    .inicio-canvas-rosca { position:relative; width:100%; max-width:240px; height:240px; margin:0 auto; }
    .inicio-legenda { list-style:none; margin:0; padding:0; display:grid; gap:8px; }
    .inicio-legenda li { display:grid; grid-template-columns:10px minmax(0,1fr) auto 48px; gap:8px; align-items:center; font-size:13px; font-variant-numeric:lining-nums tabular-nums; }
    .inicio-legenda li > strong { text-align:right; }
    .inicio-legenda li > .muted { text-align:right; }
    .inicio-legenda .bolinha { width:10px; height:10px; border-radius:50%; }
    .inicio-legenda .nome { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .inicio-lista { list-style:none; margin:0; padding:0; }
    .inicio-lista li { display:flex; justify-content:space-between; gap:12px; padding:10px 0; border-bottom:1px solid var(--areia); flex-wrap:wrap; }
    .inicio-lista li:last-child { border-bottom:0; }
    .inicio-lista .direita { text-align:right; display:flex; flex-direction:column; align-items:flex-end; font-size:13px; }
    .inicio-lista .alerta { color:var(--vermelho); font-size:12px; }

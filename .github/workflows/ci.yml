name: CI

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # O emulador do Firestore precisa de Java.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      - name: Sintaxe dos módulos do site
        run: for f in $(find public -name '*.js'); do node --input-type=module --check < "$f" || exit 1; done

      - name: Testes de formatação e cálculo
        run: npm test

      - name: Testes das regras do Firestore (emulador)
        run: npx --yes firebase-tools emulators:exec --only firestore --project demo-financeiro-teste "npm run test:rules"
